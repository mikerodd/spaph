[package]
name = "spaph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "spaph"
path = "src/main.rs"

[dependencies]
spaph-types = { workspace = true }
spaph-plugin = { workspace = true }
spaph-core = { workspace = true }
spaph-vst2 = { workspace = true }
spaph-vst3 = { workspace = true }
spaph-midi = { workspace = true }
spaph-audio = { workspace = true }
spaph-osc = { workspace = true }
spaph-config = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustyline = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "consoleapi", "processenv", "winbase", "handleapi", "wincon"] }

[dev-dependencies]
rosc = { workspace = true }
